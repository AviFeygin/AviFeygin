name: Mow the lawn

on:
  schedule:
    - cron: "0 6 * * *" # once a day
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/mower.yml"]

permissions:
  contents: write

jobs:
  mow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Draw the mower SVGs
        run: node scripts/mower.mjs ${{ github.repository_owner }} dist

      - name: Publish to the output branch
        working-directory: dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mower.svg mower-dark.svg
          git commit -q -m "Mow the lawn"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" output
